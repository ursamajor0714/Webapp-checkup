<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>목록</title>
<style>
  /* 심은 버그: 초점 표시를 지웠다, 누르는 곳이 너무 작다 */
  button { outline: none; }
  .tiny { width: 14px; height: 14px; padding: 0; font-size: 10px; }
</style></head>
<body>
  <h1>목록</h1>
  <p>첫 번째 항목입니다. 이 항목은 지울 수 있습니다. 확인 없이 지워지는 버튼과 확인을 묻는 버튼이 있습니다.</p>
  <!-- 심은 버그: 확인 없이 바로 지운다 -->
  <button id="del" onclick="fetch('/api/items/1', { method: 'DELETE' }).then(() => { document.getElementById('msg').textContent = '지움'; })">삭제</button>
  <!-- 멀쩡한 것: 먼저 묻는다 -->
  <button id="del2" onclick="if (confirm('정말 지울까요?')) fetch('/api/items/2', { method: 'DELETE' })">항목 지우기</button>
  <button class="tiny" onclick="document.getElementById('msg').textContent = '작은 버튼'">i</button>
  <a href="index.html">처음으로</a>
  <p id="msg"></p>
</body></html>
