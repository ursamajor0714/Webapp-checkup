<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>초점 괜찮은 화면</title>
<style>
  /* 멀쩡한 것: 마우스 초점 테두리는 지우고 키보드 초점에만 표시 (:focus-visible) — 오탐으로 잡으면 안 된다 */
  button, a { outline: none; padding: 12px 16px; display: inline-block; }
  button:focus-visible, a:focus-visible { outline: 3px solid #1a73e8; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style></head>
<body>
  <h1>초점</h1>
  <p>키보드로 옮기면 파란 테두리가 보이는 화면입니다. 숨긴 입력칸은 크기 검사에서 빠져야 합니다.</p>
  <label><input type="checkbox" class="sr-only"> 숨긴 체크박스</label>
  <button>하나</button> <button>둘</button> <a href="index.html">처음으로</a>
</body></html>
