# QA 자체 회귀 테스트 — 푸시·PR 마다 버그를 심은 시험용 레포를 끝까지 검사해, 심은 버그를 모두 잡는지 본다
name: QA 자체 테스트
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 러너에 깔린 Chrome 을 쓴다 (없으면 화면 검사 단정만 건너뛴다)
      - run: npm test
