<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웹앱 건강검진</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M18 33l9 9 19-20' stroke='white' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --line: #e3e6eb; --text: #1b1f24; --muted: #667080; --soft: #eef1f5;
    --ok: #1a7f45; --ok-bg: #e5f5ec; --bad: #c62828; --bad-bg: #fdecea; --warn: #a15c00; --warn-bg: #fff3dc;
    --accent: #2f5bea; --accent-bg: #e8eefe;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --panel: #171b21; --line: #2a3038; --text: #e7eaee; --muted: #9aa4b1; --soft: #1f252d;
      --ok: #4cc38a; --ok-bg: #12301f; --bad: #ff6b6b; --bad-bg: #3a1716; --warn: #f0b24a; --warn-bg: #3a2a10;
      --accent: #7c9cff; --accent-bg: #1c2544;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  button { font: inherit; cursor: pointer; }
  header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 20px; }
  header h1 { font-size: 17px; margin: 0 8px 0 0; }
  select { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); }
  .target { color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 6px 12px; border-radius: 8px; }
  .btn:hover { background: var(--soft); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .score { display: flex; align-items: baseline; gap: 6px; padding: 4px 12px; border-radius: 999px; background: var(--soft); cursor: pointer; }
  .score b { font-size: 18px; }
  .progress { height: 3px; background: var(--accent); width: 0; transition: width .3s; position: sticky; top: 0; }
  .status-line { padding: 8px 20px; background: var(--accent-bg); color: var(--accent); font-weight: 600; display: none; }
  .status-line.error { background: var(--bad-bg); color: var(--bad); }
  main { display: grid; grid-template-columns: 340px 1fr; gap: 16px; padding: 16px 20px; align-items: start; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  aside, .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  aside { padding: 8px; position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow: auto; }
  .sec h3 { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin: 12px 8px 6px; font-weight: 600; letter-spacing: .02em; }
  .area { display: grid; grid-template-columns: 28px 1fr auto auto; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
  .area:hover { background: var(--soft); }
  .area.sel { background: var(--accent-bg); }
  .letter { width: 26px; height: 26px; border-radius: 7px; background: var(--soft); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .area .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .area.todo { opacity: .45; }
  .chip { font-size: 12px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; background: var(--soft); color: var(--muted); }
  .chip.ok { background: var(--ok-bg); color: var(--ok); }
  .chip.bad { background: var(--bad-bg); color: var(--bad); }
  .chip.warn { background: var(--warn-bg); color: var(--warn); }
  .chip.run { background: var(--accent-bg); color: var(--accent); }
  .run-btn { padding: 3px 10px; font-size: 12px; }
  .panel { min-height: 60vh; }
  .ph { padding: 16px 18px 10px; border-bottom: 1px solid var(--line); }
  .ph h2 { margin: 0 0 8px; font-size: 18px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .counts { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .counts .chip { font-size: 13px; padding: 3px 10px; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: var(--panel); color: var(--text); padding: 5px 12px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent); color: #fff; }
  input[type=search] { font: inherit; padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); min-width: 220px; flex: 1; max-width: 360px; }
  .group { border-bottom: 1px solid var(--line); }
  .gh { display: flex; align-items: center; gap: 10px; padding: 10px 18px; background: var(--soft); cursor: pointer; font-weight: 600; position: sticky; top: 56px; }
  .gh .caret { width: 14px; color: var(--muted); }
  .gh .gname { flex: 1; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 7px 12px; border-top: 1px solid var(--line); vertical-align: top; }
  td.mark { width: 44px; text-align: center; font-weight: 800; font-size: 16px; }
  td.mark.ok { color: var(--ok); } td.mark.bad { color: var(--bad); } td.mark.warn { color: var(--warn); }
  tr.bad td { background: color-mix(in srgb, var(--bad-bg) 55%, transparent); }
  td.item { width: 38%; }
  td.detail { color: var(--muted); word-break: break-word; }
  .empty { padding: 60px 20px; text-align: center; color: var(--muted); }
  .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; padding: 16px 18px; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .card .k { color: var(--muted); font-size: 12px; } .card .v { font-size: 22px; font-weight: 700; }
  ul.plain { margin: 0; padding: 0 18px 16px 36px; }
  .srv { display: inline-flex; align-items: center; gap: 8px; padding: 4px 6px 4px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.up { background: var(--ok); } .dot.busy { background: var(--accent); animation: blink 1s infinite; } .dot.err { background: var(--bad); }
  @keyframes blink { 50% { opacity: .3; } }
  .srv .btn { padding: 3px 10px; font-size: 12px; border-radius: 999px; }
  .srvbar { display: none; padding: 10px 20px; background: var(--soft); border-bottom: 1px solid var(--line); }
  .srvbar.on { display: block; }
  .srvbar pre { margin: 8px 0 0; max-height: 220px; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: 12px; white-space: pre-wrap; }
  dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(560px, calc(100vw - 32px)); background: var(--panel); color: var(--text); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  .dlg-h { padding: 16px 20px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 16px; display: flex; justify-content: space-between; }
  .dlg-b { padding: 16px 20px; display: grid; gap: 14px; }
  .dlg-b label { display: grid; gap: 5px; font-weight: 600; font-size: 13px; }
  .dlg-b input { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
  .hint { color: var(--muted); font-weight: 400; font-size: 12px; }
  .dlg-f { padding: 12px 20px 16px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .dlg-f .left { margin-right: auto; }
  .steps { text-align: left; display: inline-block; margin-top: 12px; line-height: 2; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: s .8s linear infinite; vertical-align: -1px; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<header>
  <h1>QA 조회</h1>
  <select id="project" aria-label="프로젝트"></select>
  <button class="btn" id="openAdd" title="레포 폴더로 프로젝트 추가">＋ 프로젝트 추가</button>
  <span class="target" id="target"></span>
  <span class="spacer"></span>
  <span class="srv" id="srv"><span class="dot" id="srvDot"></span><span id="srvText">서버 확인 중</span><span id="srvBtns"></span></span>
  <button class="btn" id="openSettings" title="설정">⚙ 설정</button>
  <span class="score" id="score" title="전체 요약 보기"></span>
  <select id="level" aria-label="검사 수준" title="검사 수준 — 오를수록 보는 영역이 늘고 판정이 엄해진다">
    <option value="basic" title="뜨는가·터지는가·비밀이 새는가·남의 데이터가 보이는가 (빠르다)">초급 검사</option>
    <option value="standard" title="+ 입력 검증·응답 규격·접근성·보안 헤더·로그·개인정보">중급 검사</option>
    <option value="advanced" selected title="전체 영역 — 동시성·상태 전이·기능 간섭·업무 흐름·장애 대응까지">고급 검사</option>
    <option value="expert" title="현역 출시 기준 — 두 배로 넓게, 확인 필요(△)도 감점, 접근성·속도 기준을 엄하게">전문가 검사</option>
  </select>
  <button class="btn primary" id="runAll">전체 검사</button>
</header>
<div class="status-line" id="status"></div>
<div class="srvbar" id="srvbar"><b id="srvbarTitle"></b> <button class="btn run-btn" id="toggleLog">로그 보기</button><pre id="srvlog" hidden></pre></div>
<dialog id="dlg">
  <div class="dlg-h"><span>⚙ 설정 <span class="hint" id="dlgTool"></span></span><button class="btn run-btn" id="dlgClose">닫기</button></div>
  <div class="dlg-b">
    <label>레포 폴더 <span class="hint" id="rootHint"></span><input id="fRoot" placeholder="~/Developer/my-app"></label>
    <div id="acct1" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <label id="lUser">검사용 계정 아이디 <input id="fUser" autocomplete="off" placeholder="비우면 가입 경로로 자동 생성"></label>
      <label><span id="pwLabel">비밀번호</span> <span class="hint" id="pwHint"></span><input id="fPw" type="password" autocomplete="off"></label>
    </div>
    <div id="acct2" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <label>두 번째 계정 아이디 <span class="hint">남의 데이터 접근(IDOR) 검사용</span><input id="fUser2" autocomplete="off"></label>
      <label>비밀번호 <span class="hint" id="pw2Hint"></span><input id="fPw2" type="password" autocomplete="off"></label>
    </div>
    <div id="rolesBox"></div>
    <label id="lOtp">OTP <span class="hint" id="otpHint"></span><input id="fOtp" inputmode="numeric" maxlength="8" autocomplete="off"></label>
    <div id="portBox"></div>
    <div class="hint">여기 입력한 값은 이 컴퓨터의 QA 설정(.qa-local.json)에만 저장되고 저장소에 올라가지 않습니다.</div>
    <div id="dlgMsg" class="hint"></div>
  </div>
  <div class="dlg-f">
    <button class="btn left" id="btnUpdate" title="QA 와 대상 레포를 git pull">⬇ 최신 코드 받기</button>
    <button class="btn" id="btnRemove" title="화면에서 추가한 프로젝트를 목록에서 뺀다 (레포는 그대로)">목록에서 빼기</button>
    <button class="btn" id="btnRebuild" title="다시 빌드하고 켠다">다시 빌드해서 켜기</button>
    <button class="btn primary" id="btnSave">저장</button>
  </div>
</dialog>
<dialog id="addDlg">
  <div class="dlg-h"><span>＋ 프로젝트 추가</span><button class="btn run-btn" id="addClose">닫기</button></div>
  <div class="dlg-b">
    <label>레포 폴더 경로 <span class="hint">예: ~/Developer/my-app — 스택은 알아서 찾습니다</span><input id="aRoot" placeholder="~/Developer/my-app"></label>
    <div id="addMsg" class="hint"></div>
  </div>
  <div class="dlg-f"><button class="btn" id="addCheck">스택 확인</button><button class="btn primary" id="addSave">추가</button></div>
</dialog>
<main>
  <aside id="areas"></aside>
  <section class="panel" id="panel"></section>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const state = { projects: [], owasp: {}, project: null, results: {}, report: null, reportAt: null, selected: null, filter: 'all', q: '', running: null, collapsed: {}, server: [] };
const json = body => ({ method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
const cur = () => state.projects.find(x => x.id === state.project);

// QA 창(터미널)을 닫으면 화면은 남아 있어도 뒤에서 일할 서버가 없다 — 버튼이 먹통이 되기 전에 크게 알린다
function setDisconnected(off) {
  if (state.disconnected === off) return;
  state.disconnected = off;
  let bar = document.getElementById('offline');
  if (!bar) { bar = document.createElement('div'); bar.id = 'offline'; bar.style.cssText = 'position:sticky;top:0;z-index:50;padding:12px 20px;background:var(--bad);color:#fff;font-weight:700;display:none'; document.body.prepend(bar); }
  bar.innerHTML = '⚠ QA 창(터미널)이 닫혀 이 화면과 연결이 끊겼습니다. <b>QA 실행 파일을 다시 여세요</b> — 다시 열리면 이 화면이 저절로 이어집니다. (대상 서버와는 상관없습니다)';
  bar.style.display = off ? 'block' : 'none';
  if (!off) { loadProjects().then(() => { renderAll(); pollServer(); }).catch(() => {}); }
}
async function api(path, opt) {
  let r;
  try { r = await fetch(path, opt); } catch (e) { setDisconnected(true); throw new Error('QA 창이 닫혀 연결이 끊겼습니다 — QA 실행 파일을 다시 여세요'); }
  setDisconnected(false);
  const body = await r.json().catch(() => null);
  if (!r.ok) throw new Error((body && body.error) || r.status);
  return body;
}

// 검사(check) 하나를 O/X 행들로 — items 가 있으면 그대로, 없으면 검사 자체를 한 줄로
function rowsOf(c) {
  if (c.items) return c.items.map(i => ({ name: i.name, detail: i.detail || '', ik: i.name, ignored: i.ignored, mark: i.ok === true ? 'ok' : i.ok === null ? 'warn' : 'bad' }));
  const rows = [];
  if (c.failed > 0) (c.notes && c.notes.length ? c.notes : [`${c.failed}건 문제`]).forEach(n => rows.push({ name: c.name, detail: n, ik: n, mark: 'bad' }));
  (c.warnNotes || []).forEach(n => rows.push({ name: c.name, detail: n, ik: n, mark: 'warn' }));
  if (c.passed > 0 || !rows.length) rows.push({ name: c.name, detail: c.failed > 0 ? `나머지 ${c.passed}건 통과` : (c.notes || []).join(' / ') || `${c.passed}건 통과`, mark: 'ok' });
  return rows;
}
const countOf = r => {
  const rows = (r.checks || []).flatMap(rowsOf);
  return { all: rows.length, ok: rows.filter(x => x.mark === 'ok').length, bad: rows.filter(x => x.mark === 'bad').length, warn: rows.filter(x => x.mark === 'warn').length };
};

function chipFor(p) {
  const j = state.running;
  if (j && j.current && j.current.id === p.id) return '<span class="chip run"><span class="spin"></span> 검사 중</span>';
  if (j && j.status === 'running' && (!j.ids.length || j.ids.includes(p.id)) && !j.results.some(r => r.id === p.id)) return '<span class="chip run">대기</span>';
  const r = state.results[p.id];
  if (!r) return '<span class="chip">미검사</span>';
  if (r.error) return '<span class="chip bad">실행 오류</span>';
  if (r.skip) return r.setup ? '<span class="chip warn" title="' + esc(r.skip) + '">설정 오류</span>' : '<span class="chip" title="' + esc(r.skip) + '">해당 없음</span>';
  const n = countOf(r);
  if (n.bad) return `<span class="chip bad">X ${n.bad}</span>`;
  if (n.warn) return `<span class="chip warn">△ ${n.warn}</span>`;
  return `<span class="chip ok">O ${n.ok}</span>`;
}

function renderAreas() {
  const t = cur();
  if (!t) { $('#areas').innerHTML = ''; return; }
  const busy = state.running && state.running.status === 'running';
  const ow = state.report && state.report.summary && state.report.summary.owasp;
  const owBad = ow ? ow.filter(x => x.status === '문제').length : null;
  const mt = state.report && state.report.maturity;
  $('#areas').innerHTML = `<div class="sec"><h3><span>기준</span></h3>
      <div class="area ${state.selected === '__ignored' ? 'sel' : ''}" data-view="__ignored"><span class="letter">—</span><span class="nm">무시 목록</span><span class="chip">${state.ignores ? esc(state.ignores.length) : ''}</span><span></span></div>
      <div class="area ${state.selected === '__maturity' ? 'sel' : ''}" data-view="__maturity"><span class="letter">◆</span><span class="nm">운영 성숙도</span>${mt ? `<span class="chip ${mt.got / mt.total >= 0.75 ? 'ok' : mt.got / mt.total >= 0.4 ? 'warn' : 'bad'}">${esc(mt.got)}/${esc(mt.total)}</span>` : '<span class="chip">전체 검사 후</span>'}<span></span></div>
      <div class="area ${state.selected === '__owasp' ? 'sel' : ''}" data-view="__owasp"><span class="letter">10</span><span class="nm">OWASP Top 10 (2025)</span>${ow ? (owBad ? `<span class="chip bad">문제 ${owBad}</span>` : '<span class="chip ok">O</span>') : '<span class="chip">전체 검사 후</span>'}<span></span></div></div>` +
    t.sections.map(sec => {
    const sc = state.report && state.report.summary && (state.report.summary.sections || []).find(x => x.dir === sec.dir);
    return `<div class="sec"><h3><span>${esc(sec.label)}</span><span>${sc && sc.score !== null ? esc(sc.score) + '점' : ''}</span></h3>` +
      sec.probes.map(p => `<div class="area ${state.selected === p.id ? 'sel' : ''}" data-id="${esc(p.id)}">
        <span class="letter">${esc(p.id)}</span><span class="nm" title="${esc(p.name)}${p.origin !== 'common' ? ' (이 프로젝트 전용 검사 포함)' : ''}">${esc(p.name)}${p.origin !== 'common' ? ' ★' : ''}</span>${chipFor(p)}
        <button class="btn run-btn" data-run="${esc(p.id)}" ${busy ? 'disabled' : ''}>조회</button>
      </div>`).join('') + '</div>';
  }).join('');
}

// 점수에 넣지 않는 참고 정보 (외부 서비스 목록 등)
function infoBox(r) {
  const i = r && r.info; if (!i || !(i.items || []).length) return '';
  return `<div class="group"><div class="gh">☁ ${esc(i.title)}</div><table>${i.items.map(x => `<tr><td class="mark">·</td><td class="item"><b>${esc(x.name)}</b> <span class="chip">${esc(x.kind)}</span><div class="hint">${esc(x.why.join(' · '))}</div></td><td class="detail">${esc(x.watch)}</td></tr>`).join('')}</table></div>`;
}
function renderPanel() {
  const panel = $('#panel');
  if (state.selected === '__summary') return renderSummary();
  if (state.selected === '__maturity') return renderMaturity();
  if (state.selected === '__ignored') return renderIgnored();
  if (state.selected === '__owasp') return renderOwasp();
  const t = cur();
  const probe = t && t.sections.flatMap(s => s.probes).find(p => p.id === state.selected);
  const r = state.results[state.selected];
  if (!probe) { panel.innerHTML = guide(); return; }
  const busy = state.running && state.running.status === 'running';
  const tags = (probe.owasp || []).map(o => `<span class="chip" title="${esc(state.owasp[o] || '')}">OWASP ${esc(o)}</span>`).join('');
  const head = `<div class="ph"><h2><span class="letter">${esc(probe.id)}</span>${esc(probe.name)} ${tags}
      <button class="btn run-btn" data-run="${esc(probe.id)}" ${busy ? 'disabled' : ''}>${r ? '다시 조회' : '조회'}</button></h2>`;
  if (!r) { panel.innerHTML = head + `</div><div class="empty">${busy ? '<span class="spin"></span> 검사 중입니다…' : '아직 검사하지 않았습니다. [조회]를 누르세요.'}</div>`; return; }
  if (r.error) { panel.innerHTML = head + `</div><div class="empty" style="color:var(--bad)">실행 오류: ${esc(r.error)}</div>`; return; }
  if (r.skip) { panel.innerHTML = head + `</div><div class="empty"><b>${r.setup ? '⚙ 설정 오류로 못 잼 — 제품 결함이 아니다' : '잴 수 없음 · 해당 없음'}</b><p>${esc(r.skip)}</p>${r.finding ? `<p style="color:var(--bad)">${esc(r.finding)}</p>` : ''}</div>${infoBox(r)}`; return; }
  const n = countOf(r);
  const f = state.filter, q = state.q.trim().toLowerCase();
  const tabs = [['all', `전체 ${n.all}`], ['bad', `문제 ${n.bad}`], ['ok', `통과 ${n.ok}`], ['warn', `확인 필요 ${n.warn}`]];
  let html = head + `<div class="counts">
      <span class="chip">검사 ${n.all}건</span><span class="chip ok">O 통과 ${n.ok}</span>
      <span class="chip bad">X 문제 ${n.bad}</span><span class="chip warn">△ 확인 필요 ${n.warn}</span>
      <span class="chip">${esc(r.ms)}ms</span></div>
    ${r.partial ? `<div class="hint" style="margin-bottom:8px">일부만 쟀습니다: ${esc(r.partial)}</div>` : ''}
    ${(r.skipped || []).length ? `<details class="hint" style="margin-bottom:8px"><summary>건너뛴 것 ${r.skipped.length}건</summary>${r.skipped.map(esc).join('<br>')}</details>` : ''}
    <div class="tools"><div class="seg">${tabs.map(([k, l]) => `<button data-filter="${k}" class="${f === k ? 'on' : ''}">${l}</button>`).join('')}</div>
      <input type="search" id="q" placeholder="항목·내용 검색" value="${esc(state.q)}"></div></div>`;
  let shown = 0;
  r.checks.forEach((c, gi) => {
    const all = rowsOf(c);
    const rows = all.filter(x => (f === 'all' || x.mark === f) && (!q || (x.name + ' ' + x.detail).toLowerCase().includes(q)));
    if (!rows.length) return;
    shown += rows.length;
    const key = `${r.id}:${gi}`;
    const bad = all.filter(x => x.mark === 'bad').length, ok = all.filter(x => x.mark === 'ok').length, warn = all.filter(x => x.mark === 'warn').length;
    const closed = state.collapsed[key] ?? false;
    html += `<div class="group"><div class="gh" data-toggle="${key}"><span class="caret">${closed ? '▸' : '▾'}</span>
      <span class="gname">${esc(c.name)}</span>${[].concat(c.owasp || []).map(o => `<span class="chip">${esc(o)}</span>`).join('')}${bad ? `<span class="chip bad">X ${bad}</span>` : ''}${warn ? `<span class="chip warn">△ ${warn}</span>` : ''}<span class="chip ok">O ${ok}</span></div>`;
    if (!closed) {
      html += '<table>' + rows.slice(0, 1500).map(x => `<tr class="${x.mark === 'bad' ? 'bad' : ''}"><td class="mark ${x.mark}">${x.ignored ? '—' : x.mark === 'ok' ? 'O' : x.mark === 'bad' ? 'X' : '△'}</td>
        <td class="item">${esc(x.name)}</td><td class="detail">${esc(x.detail)}${x.mark !== 'ok' ? ` <button class="btn run-btn ign" title="오탐이거나 의도한 것이면 다음 검사부터 뺀다 (대상 레포 .qa-ignore.json)" data-ig="${esc(JSON.stringify({ area: r.id, check: c.name, item: x.ik }))}">무시</button>` : ''}</td></tr>`).join('') + '</table>';
    }
    html += '</div>';
  });
  html += infoBox(r);
  if (!shown) html += `<div class="empty">${f === 'bad' ? '문제가 없습니다. 👍' : '조건에 맞는 항목이 없습니다.'}</div>`;
  panel.innerHTML = html;
}

// OWASP Top 10 — 항목마다 몇 건을 쟀고, 무엇이 걸렸고, 어느 영역이 재는지
function renderOwasp() {
  const ow = state.report && state.report.summary && state.report.summary.owasp;
  const t = cur();
  const byTag = {};
  for (const p of (t ? t.sections.flatMap(s => s.probes) : [])) for (const o of p.owasp || []) (byTag[o] ||= []).push(p);
  const rowsFor = id => Object.values(state.results).flatMap(r => (r.checks || []).filter(c => [].concat(c.owasp || []).includes(id)).map(c => ({ r, c })));
  let html = `<div class="ph"><h2>OWASP Top 10 (2025) <span class="chip">${esc(state.reportAt || '전체 검사 전')}</span></h2>
    <div class="hint">각 검사에 OWASP 항목을 붙여 두었습니다. '못 잼' 은 이 프로젝트에서 해당 영역을 잴 수 없었다는 뜻입니다 (서버 꺼짐·로그인 없음·해당 기능 없음).</div></div>`;
  html += '<table>' + Object.entries(state.owasp).map(([id, name]) => {
    const x = ow && ow.find(o => o.id === id);
    const st = x ? x.status : '미검사';
    const mark = st === '통과' ? 'ok' : st === '문제' ? 'bad' : st === '확인 필요' ? 'warn' : '';
    const areas = (byTag[id] || []).map(p => `<a href="#" data-goto="${esc(p.id)}">${esc(p.id)}</a>`).join(' ');
    return `<tr class="${mark === 'bad' ? 'bad' : ''}"><td class="mark ${mark}">${mark === 'ok' ? 'O' : mark === 'bad' ? 'X' : mark === 'warn' ? '△' : '-'}</td>
      <td class="item"><b>${esc(id)}</b> ${esc(name)}</td>
      <td class="detail">${x ? `${esc(st)} · 검사 ${esc(x.scanned)} · 문제 ${esc(x.failed)} · 확인 ${esc(x.warned)}` : esc(st)} · 영역 ${areas || '-'}${x && x.skippedAreas.length ? ` · 못 잰 영역 ${x.skippedAreas.map(esc).join(' ')}` : ''}</td></tr>`;
  }).join('') + '</table>';
  for (const [id, name] of Object.entries(state.owasp)) {
    const bad = rowsFor(id).flatMap(({ r, c }) => rowsOf(c).filter(x => x.mark !== 'ok').map(x => ({ ...x, area: r.id })));
    if (!bad.length) continue;
    html += `<div class="group"><div class="gh">${esc(id)} ${esc(name)} — 걸린 것 ${bad.length}</div><table>` + bad.slice(0, 200).map(x => `<tr class="${x.mark === 'bad' ? 'bad' : ''}"><td class="mark ${x.mark}">${x.mark === 'bad' ? 'X' : '△'}</td><td class="item">[${esc(x.area)}] ${esc(x.name)}</td><td class="detail">${esc(x.detail)}</td></tr>`).join('') + '</table></div>';
  }
  $('#panel').innerHTML = html;
}

// 운영 성숙도 — 항목마다 왜 중요한가 · 무엇을 찾았나 · 어떻게 갖추나 · 갖추면 몇 점
// 무시 목록 — 되살리면 다음 검사부터 다시 센다
function renderIgnored() {
  const list = state.ignores || [];
  $('#panel').innerHTML = `<div class="ph"><h2>무시 목록 <span class="chip">${esc(list.length)}개</span></h2>
    <div class="hint">결과의 X·△ 줄에서 [무시] 를 누르면 여기에 쌓인다. 대상 레포의 <b>${esc(state.ignoreFile || '.qa-ignore.json')}</b> 에 저장되니 깃에 올리면 팀원·CI 도 같은 기준을 쓴다. 무시한 문제는 통과로 세고 결과에 '무시함' 으로 남는다.</div></div>
    ${list.length ? `<table>${list.map(i => `<tr><td class="mark">—</td><td class="item">[${esc(i.area)}] ${esc(i.check)}<br><span class="hint">${esc(i.item)}</span></td><td class="detail">${esc(i.reason || '이유 없음')} · ${esc(i.at || '')} <button class="btn run-btn" data-unig="${esc(i.key)}">되살리기</button></td></tr>`).join('')}</table>` : '<div class="empty">무시한 문제가 없다.</div>'}`;
}
async function loadIgnores() {
  const r = await api('/api/ignore?project=' + encodeURIComponent(state.project)).catch(() => null);
  state.ignores = r ? r.items : []; state.ignoreFile = r ? r.file : null;
}
// 화면의 결과에도 바로 반영 (다음 검사를 기다리지 않게)
function ignoreLocal(area, check, item, reason) {
  const r = state.results[area]; if (!r) return;
  for (const c of r.checks || []) {
    if (c.name !== check) continue;
    if (c.items) for (const it of c.items) if (it.name === item && it.ok !== true) { it.ignored = reason; it.ok = true; it.detail = `무시함 (${reason || '이유 없음'}) — ${it.detail}`; }
    if (!c.items) { if ((c.notes || []).includes(item)) { c.notes = c.notes.filter(n => n !== item); c.failed = Math.max(0, c.failed - 1); c.passed++; } if ((c.warnNotes || []).includes(item)) { c.warnNotes = c.warnNotes.filter(n => n !== item); c.warned = Math.max(0, c.warned - 1); c.passed++; } }
  }
}

function renderMaturity() {
  const m = state.report && state.report.maturity, s = state.report && state.report.summary;
  if (!m) { $('#panel').innerHTML = '<div class="empty">[전체 검사]를 돌리면 운영 성숙도가 나옵니다.</div>'; return; }
  const items = [...m.items].sort((a, b) => (a.ok - b.ok) || ((b.plus || 0) - (a.plus || 0)));
  const allPlus = Math.round(items.filter(i => !i.ok).reduce((a, i) => a + (i.plus || 0), 0) * 10) / 10;
  $('#panel').innerHTML = `<div class="ph"><h2>운영 성숙도 <span class="chip">${esc(m.got)}/${esc(m.total)}점</span>${allPlus ? `<span class="chip ok">빠진 것 ${esc(allPlus)}점</span>` : ''}</h2>
    <div class="hint">"지금 멀쩡한가" 는 A~Z 영역이 보고, 여기서는 "멀쩡함이 계속 유지되는 장치가 있는가" 를 본다. 문서에 이름만 적힌 것은 치지 않는다 — 실제 설정·스크립트·파일이 있어야 한다.
    제품 점수(${esc(s ? s.score : '')})와 곱하지 않고 따로 본다 — 제품이 멀쩡한가와 멀쩡함이 유지되는 장치가 있는가는 다른 질문이다.</div></div>
    ${items.map(i => `<div class="group"><div class="gh" style="position:static"><span class="mark ${i.ok ? 'ok' : 'bad'}" style="font-weight:800;color:var(--${i.ok ? 'ok' : 'bad'})">${i.ok ? 'O' : 'X'}</span>
        <span class="gname">${esc(i.label)}</span><span class="chip">${esc(i.weight)}점</span>${!i.ok && i.plus ? `<span class="chip ok">갖추면 +${esc(i.plus)}점</span>` : ''}</div>
      <div style="padding:10px 18px 14px">
        ${i.why ? `<div><b>왜</b> — ${esc(i.why)}</div>` : ''}
        <div style="margin-top:4px"><b>${i.ok ? '찾은 것' : '찾아본 곳'}</b> — <span class="hint">${esc(i.ok ? (i.found || '있음') : (i.look || '-'))}</span></div>
        ${!i.ok && (i.how || []).length ? `<div style="margin-top:6px"><b>어떻게 갖추나</b><ul style="margin:4px 0 0 18px;padding:0">${i.how.map(h => `<li>${esc(h)}</li>`).join('')}</ul></div>` : ''}
        ${!i.ok && !i.how ? '<div class="hint">예전 검사 결과라 개선 방법이 없다 — 전체 검사를 다시 돌리면 나온다</div>' : ''}
      </div></div>`).join('')}`;
}

// AI 에게 넘길 수정 요청 — 검사는 토큰 0 으로 끝내고, 고치는 데만 AI 를 쓴다. 원인 묶음과 먼저 고칠 것만 담아 짧게
function fixPrompt(s) {
  const L = [`레포 ${s.root || s.target} 를 웹앱 건강검진(webapp-checkup)으로 검사한 결과다. 아래 문제를 고쳐 줘.`,
    `- 이 레포 폴더에서 작업한다 (다른 폴더에 열려 있으면 먼저 알려 줘). 새 브랜치(예: fix/qa-findings)를 만들어 고치고, main 에 바로 올리지 않는다.`,
    '- 한 번에 한 원인씩 고치고, 고친 뒤 무엇을 왜 바꿨는지 짧게 알려 줘.',
    '- 오탐(실제로는 문제가 아닌 것)으로 보이면 고치지 말고 그렇게 판단한 이유를 말해 줘.', ''];
  if ((s.hotspots || []).length) { L.push('## 한 원인이 여러 곳에 걸린 곳 (먼저)'); s.hotspots.forEach(h => L.push(`- ${[h.methods.join('·'), h.path].filter(Boolean).join(' ')} — 영역 ${h.areas.join(' ')} · ${h.count}건. ${h.hint}`, ...h.examples.map(e => `  - [${e.area}] ${e.item} — ${e.detail}`))); L.push(''); }
  if ((s.top || []).length) { L.push('## 먼저 고칠 것 (영향 큰 순서)'); s.top.forEach((t, i) => L.push(`${i + 1}. [${t.area}] ${t.check} — ${t.failed}건`, ...t.examples.slice(0, 3).map(x => `   - ${x}`))); L.push(''); }
  L.push(`고친 뒤 다시 검사 (QA 폴더에서, 사람이 돌린다): node run.js ${state.project}`);
  return L.join('\n');
}
function renderSummary() {
  const s = state.report && state.report.summary;
  if (!s) { $('#panel').innerHTML = '<div class="empty">[전체 검사]를 돌리면 점수 요약이 나옵니다.</div>'; return; }
  const self = (state.report.selfcheck && state.report.selfcheck.items) || [];
  const mat = (state.report.maturity && state.report.maturity.items) || [];
  const htmlFile = state.reportFile ? state.reportFile.replace(/\.json$/, '.html') : null;
  $('#panel').innerHTML = `<div class="ph"><h2>전체 요약 <span class="chip">${esc(state.reportAt || '')}</span>${s.level ? ` <span class="chip" title="${esc(s.level.desc)}">${esc(s.level.label)} 검사</span>` : ''}${htmlFile ? ` <a class="btn run-btn" target="_blank" href="/api/report.html?project=${encodeURIComponent(state.project)}&file=${encodeURIComponent(htmlFile)}">HTML 리포트 열기 (공유용)</a>` : ''}${(s.top || []).length ? ` <button class="btn run-btn" data-copyfix title="먼저 고칠 것과 한 원인 묶음을 AI 에게 붙여 넣을 글로 복사한다">AI 에게 고쳐 달라기 — 복사</button>` : ''}</h2></div>
    <div class="summary-grid">
      <div class="card"><div class="k">제품 점수${s.level ? ` · ${esc(s.level.label)} 검사` : ''}</div><div class="v">${esc(s.score)}</div><div class="k">등급 ${esc(s.grade)}${s.level && s.level.strict ? ' · 확인 필요도 감점' : ''}${s.coverage ? ` · 영역 ${esc(s.coverage.measured)}/${esc(s.coverage.total)} 잼${s.coverage.measured < s.coverage.total / 2 ? ' (절반 미만 — 점수를 믿기 어렵다)' : ''}` : ''}</div></div>
      ${s.actionable ? `<div class="card"><div class="k">손댈 곳</div><div class="v">${esc(s.actionable.fix)}곳</div><div class="k">문제 ${esc(s.actionable.failed)}건을 원인별로 묶음 · 사람이 볼 곳 ${esc(s.actionable.look)}곳 (△ ${esc(s.actionable.warned)}건)</div></div>` : ''}
      <div class="card"><div class="k">검사 / 통과 / 문제</div><div class="v">${esc(s.scanned)} / ${esc(s.passed)} / ${esc(s.failed)}</div><div class="k">확인 필요 ${esc(s.warned)} · 자동으로 만든 시험 입력 ${esc(s.generated ?? '-')}개 포함</div></div>
      <div class="card" data-view="__maturity" style="cursor:pointer" title="눌러서 항목·개선 방법 보기"><div class="k">운영 성숙도 ▸ (따로 본다)</div><div class="v">${esc(s.maturity.got)}/${esc(s.maturity.total)}</div><div class="k">${esc(s.maturity.label || '')} · 누르면 빠진 것과 고치는 법</div></div>
      ${(s.sections || []).map(x => `<div class="card"><div class="k">${esc(x.label)}</div><div class="v">${x.score === null ? '-' : esc(x.score)}</div></div>`).join('')}
    </div>
    ${(s.setupErrors || []).length ? `<div class="group"><div class="gh" style="color:var(--warn)">⚠ 설정 오류 — 제품 결함이 아니라 검사 설정 문제 (점수·먼저 고칠 것에 넣지 않았다)</div><table>${s.setupErrors.map(e => `<tr><td class="mark warn">⚙</td><td class="item" colspan="2">${esc(e)}</td></tr>`).join('')}${(s.skippedAreas || []).some(a => a.setup) ? `<tr><td class="mark">→</td><td class="item" colspan="2">이 때문에 못 잰 영역: ${esc(s.skippedAreas.filter(a => a.setup).map(a => a.id).join(' '))} — ⚙ 설정을 고치고 다시 돌리면 잰다</td></tr>` : ''}</table></div>` : ''}
    ${s.diff ? (() => { const d = s.diff, dl = Math.round((d.score - d.prevScore) * 10) / 10; return `<div class="group"><div class="gh">▲ 지난 검사와 비교 — 점수 ${esc(d.prevScore)} → ${esc(d.score)} (${dl >= 0 ? '+' : ''}${esc(dl)}) · <span class="chip bad">새 문제 ${esc(d.addedCount)}</span> <span class="chip ok">고친 것 ${esc(d.fixedCount)}</span>${d.same ? ` <span class="chip" title="이번과 지난번 모두 잰 영역끼리만 매긴 점수 — 못 잰 영역이 달라져 흔들린 것을 뺀다">같은 영역 ${esc(d.same.areas)}개끼리 ${esc(d.same.prev)} → ${esc(d.same.now)}</span>` : ''}${d.qaNote ? `<div class="detail">⚠ ${esc(d.qaNote)}</div>` : ''}</div><table>${(d.areaChanges || []).length && Math.abs(dl) >= 0.5 ? d.areaChanges.slice(0, 8).map(c => `<tr><td class="mark warn">Δ</td><td class="item">[${esc(c.id)}] ${esc(c.name)} ${esc(c.before ?? '못 잼')} → ${esc(c.after ?? '못 잼')}</td><td class="detail">점수가 바뀐 이유: ${esc(c.why.join(' · '))}</td></tr>`).join('') : ''}${d.added.slice(0, 20).map(x => `<tr class="bad"><td class="mark bad">+</td><td class="item">[${esc(x.area)}] ${esc(x.check)}</td><td class="detail">${esc(x.item)}${x.detail ? ' — ' + esc(x.detail) : ''}</td></tr>`).join('')}${d.fixed.slice(0, 20).map(x => `<tr><td class="mark ok">✓</td><td class="item">[${esc(x.area)}] ${esc(x.check)}</td><td class="detail">${esc(x.item)} — 고쳐졌다</td></tr>`).join('')}</table></div>`; })() : ''}
    ${s.diff && (s.diff.perf || []).length ? `<div class="group"><div class="gh">▲ 지난 검사보다 무거워진 화면 — 조금씩 느려지는 것은 한 번 검사로는 안 보인다</div><table>${s.diff.perf.map(p => `<tr class="${p.level === 'bad' ? 'bad' : ''}"><td class="mark ${p.level === 'bad' ? 'bad' : 'warn'}">${p.level === 'bad' ? 'X' : '△'}</td><td class="item">${esc(p.page)} · ${esc(p.metric)}</td><td class="detail">${esc(p.before)} → ${esc(p.after)} (+${esc(p.pct)}%)</td></tr>`).join('')}</table></div>` : ''}
    ${(() => { const sh = (state.report.results || []).flatMap(r => (r.shots || []).map(x => ({ ...x, area: r.id }))); return sh.length ? `<div class="group"><div class="gh">📷 문제가 난 화면 ${sh.length}장</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;padding:10px">${sh.map(x => `<figure style="margin:0"><figcaption class="hint">[${esc(x.area)}] ${esc(x.where)}</figcaption><img alt="${esc(x.where)} 화면" loading="lazy" src="data:image/jpeg;base64,${/^[A-Za-z0-9+/=]+$/.test(x.jpg) ? x.jpg : ''}" style="width:100%;border:1px solid var(--line, #ddd);border-radius:6px"></figure>`).join('')}</div></div>` : ''; })()}

    ${(s.skippedAreas || []).length ? `<div class="group"><div class="gh">잴 수 없었던 영역 (점수에서 뺌)</div><table>${s.skippedAreas.map(a => `<tr><td class="mark">-</td><td class="item">${esc(a.id)} ${esc(a.name || '')}</td><td class="detail">${esc(a.why || a.skip || '')}</td></tr>`).join('')}</table></div>` : ''}
    <div class="group"><div class="gh" data-view="__maturity" style="cursor:pointer">운영 성숙도 ${esc(s.maturity.got)}/${esc(s.maturity.total)} — 눌러서 개선 방법 보기 ▸</div><table>${mat.map(i => `<tr class="${i.ok ? '' : 'bad'}" data-view="__maturity" style="cursor:pointer"><td class="mark ${i.ok ? 'ok' : 'bad'}">${i.ok ? 'O' : 'X'}</td><td class="item">${esc(i.label)}</td><td class="detail">${esc(i.weight)}점${i.ok ? '' : ' · 빠짐'}</td></tr>`).join('')}</table></div>

}

function renderHeader() {
  const t = cur();
  $('#target').innerHTML = t ? `${t.parts.map(p => `<span class="chip" title="${esc(p.dir)}">${esc(p.label)}${p.dir !== '.' ? ' · ' + esc(p.dir) : ''}</span>`).join(' ')}${!t.rootExists ? ' <span style="color:var(--bad)">레포 폴더를 못 찾음 — ⚙ 설정에서 지정</span>' : ''}` : '';
  const s = state.report && state.report.summary;
  $('#score').innerHTML = s ? `<span>제품</span><b>${esc(s.score)}</b><span>${esc(s.grade)} · 성숙도 ${esc(s.maturity.got)}/${esc(s.maturity.total)}</span>` : '<span>점수 없음</span>';
  $('#runAll').disabled = !!(state.running && state.running.status === 'running') || !t || !t.rootExists;
  $('#srv').style.display = state.server.length ? '' : 'none';
}

function renderStatus() {
  const j = state.running, el = $('#status'), bar = $('#progress');
  if (!j) { el.style.display = 'none'; bar.style.width = 0; return; }
  const t = cur();
  const total = j.total || j.ids.length || (t ? t.sections.flatMap(s => s.probes).length : 1);
  el.className = 'status-line' + (j.status === 'error' ? ' error' : '');
  el.style.display = 'block';
  if (j.status === 'running') {
    el.innerHTML = `<span class="spin"></span> 검사 중 ${j.results.length}/${total}${j.current ? ` · ${esc(j.current.id)} ${esc(j.current.name)}` : ' · 준비 (경로 찾기·로그인·규칙 뽑기)'}`;
    bar.style.width = `${Math.round(j.results.length / total * 100)}%`;
  } else if (j.status === 'error') {
    el.textContent = `실행 오류: ${j.error}`; bar.style.width = 0;
  } else {
    const secs = Math.round((j.finishedAt - j.startedAt) / 1000);
    el.innerHTML = `끝 · ${j.results.length}개 영역 · ${secs}초` + (j.report && j.report.full ? ` · 리포트 저장 ${esc(j.report.file)}` : '') + ((j.notes || []).length ? `<div class="hint" style="font-weight:400">${j.notes.map(esc).join('<br>')}</div>` : '');
    bar.style.width = 0;
    setTimeout(() => { if (state.running === j) { state.running = null; renderStatus(); } }, 12000);
  }
}

function renderAll() { renderHeader(); renderAreas(); renderPanel(); renderStatus(); renderServer(); }

      <li>${up ? '✅' : '②'} 서버는 켜 두지 않아도 됩니다 — <b>[전체 검사]</b> 때 QA 가 설치·빌드·실행까지 하고 서버 로그의 오류도 봅니다</li>

const PHASE = { idle: '꺼짐', installing: '설치 중', building: '빌드 중', starting: '켜는 중', running: '켜짐', stopping: '끄는 중', error: '오류' };
function renderServer() {
  const sv = state.server || [];
  if (!sv.length) { $('#srvbar').className = 'srvbar'; return; }
  const busy = sv.some(p => ['installing', 'building', 'starting', 'stopping'].includes(p.phase));
  const upN = sv.filter(p => p.up).length;
  const err = sv.find(p => p.phase === 'error');
  $('#srvDot').className = 'dot ' + (upN === sv.length ? 'up' : busy ? 'busy' : err ? 'err' : '');
  $('#srvText').innerHTML = `서버 <b>${upN}/${sv.length} 켜짐</b>`;
  $('#srv').title = sv.map(p => `${p.label} ${p.dir} ${p.baseUrl} — ${p.up ? '켜짐' : PHASE[p.phase]}`).join('\n');
  $('#srvBtns').innerHTML = busy ? '<span class="spin"></span>'
    : upN < sv.length && sv.some(p => !p.up && p.canServe) ? '<button class="btn primary" data-srv="start">서버 켜기</button>'
    : sv.some(p => p.managed) ? '<button class="btn" data-srv="stop">끄기</button>' : '';
  const bar = $('#srvbar');
  bar.className = 'srvbar' + (busy || err || !$('#srvlog').hidden ? ' on' : '');
  const active = sv.find(p => ['installing', 'building', 'starting'].includes(p.phase));
  $('#srvbarTitle').innerHTML = err ? `<span style="color:var(--bad)">✗ ${esc(err.label)} (${esc(err.dir)}): ${esc(err.error || '오류')}</span>` : active ? `<span class="spin"></span> ${esc(active.label)} ${esc(PHASE[active.phase])}…` : '서버 로그';
  $('#srvlog').textContent = sv.map(p => `── ${p.label} (${p.dir}) ${p.baseUrl}\n${(p.log || []).join('\n')}`).join('\n\n');
  if (!$('#srvlog').hidden) $('#srvlog').scrollTop = 1e9;
}

async function pollServer() {
  if (!state.project) return;
  const mine = state.project;
  const sv = await api('/api/server?project=' + encodeURIComponent(mine)).catch(() => null);
  if (mine !== state.project) return;
  if (state.disconnected) { clearTimeout(state.srvTimer); state.srvTimer = setTimeout(pollServer, 3000); return; }   // 다시 열릴 때까지 3초마다 두드린다
  state.server = sv || [];
  renderServer(); renderHeader();
  const busy = state.server.some(p => ['installing', 'building', 'starting', 'stopping'].includes(p.phase));
  clearTimeout(state.srvTimer);
  state.srvTimer = setTimeout(pollServer, busy ? 1000 : 4000);
}
async function serverAction(action, extra = {}) {
  try { await api('/api/server/' + action, json({ project: state.project, ...extra })); } catch (e) { alert(e.message); }
  if (action === 'start') { $('#srvlog').hidden = false; $('#toggleLog').textContent = '로그 숨기기'; }
  setTimeout(pollServer, 300);
}

    ? `<div class="hint" style="margin-bottom:6px"><b>POST ${esc(r.path)}</b> — ${esc(r.desc)}. <b>넣을 것 없음</b>.</div>`

  const t = cur();

async function openSettings() { if (!state.project) return; await loadSettings(); fillSettings(); $('#dlg').showModal(); }
async function saveSettings() {
  try {
    const parts = {};
    document.querySelectorAll('[data-port]').forEach(i => { parts[i.dataset.port] = { port: i.value.trim() }; });
    const roles = {};
    document.querySelectorAll('[data-role-pw]').forEach(i => { const u = document.querySelector(`[data-role-user="${CSS.escape(i.dataset.rolePw)}"]`); roles[i.dataset.rolePw] = { user: u ? u.value : undefined, password: i.value }; });
    state.settings = await api('/api/settings', json({ project: state.project, root: $('#fRoot').value, user: $('#fUser').value, password: $('#fPw').value, user2: $('#fUser2').value, password2: $('#fPw2').value, otp: $('#fOtp').value, parts, roles }));
    fillSettings();
    $('#dlgMsg').innerHTML = '<span style="color:var(--ok)">저장했습니다.</span>';
    await loadProjects();
    renderHeader(); renderAreas(); pollServer(); if (!state.selected) renderPanel();
    return true;
  } catch (e) { $('#dlgMsg').innerHTML = `<span style="color:var(--bad)">${esc(e.message)}</span>`; return false; }
}
async function updateCode() {
  $('#dlgMsg').innerHTML = '<span class="spin"></span> 최신 코드를 받는 중…';
  try {
    const r = await api('/api/update', json({ project: state.project }));
    const line = (name, x) => `${name}: ${x.ok ? (x.changed ? '✅ 새 코드 받음' : '이미 최신') : '✗ ' + esc(x.out)}`;
    $('#dlgMsg').innerHTML = line('QA', r.qa) + '<br>' + line('대상 레포', r.target) +
      (r.targetChanged ? '<br>대상 코드가 바뀌었습니다 — <b>[다시 빌드해서 켜기]</b>를 누르세요.' : '') +
      (r.restart ? '<br><span class="spin"></span> QA 화면을 새 코드로 다시 띄우는 중…' : (r.qa.changed ? '<br>QA 화면 코드가 바뀌었습니다 — 창을 닫고 다시 실행하세요.' : ''));
    if (r.restart) waitAndReload();
  } catch (e) { $('#dlgMsg').innerHTML = `<span style="color:var(--bad)">${esc(e.message)}</span>`; }
}
async function waitAndReload() {
  await new Promise(r => setTimeout(r, 1500));
  for (let i = 0; i < 60; i++) {
    if (await fetch('/api/ping').then(r => r.ok).catch(() => false)) { location.reload(); return; }
    await new Promise(r => setTimeout(r, 1000));
  }
}

// ── 프로젝트 추가
async function addProject(dry) {
  $('#addMsg').innerHTML = '<span class="spin"></span> 찾는 중…';
  try {
    const r = await api('/api/projects/add', json({ root: $('#aRoot').value, dry }));
    if (dry) { $('#addMsg').innerHTML = `찾은 스택: <b>${r.parts.map(esc).join(' + ')}</b> — [추가]를 누르세요`; return; }
    $('#addDlg').close();
    await loadProjects();
    fillSelect();
    $('#project').value = r.id;
    await loadProject(r.id);
    openSettings();
  } catch (e) { $('#addMsg').innerHTML = `<span style="color:var(--bad)">${esc(e.message)}</span>`; }
}

async function loadProjects() { const r = await api('/api/projects'); state.projects = r.projects; state.owasp = r.owasp; }
function fillSelect() {
  $('#project').innerHTML = state.projects.map(t => `<option value="${esc(t.id)}">${esc(t.name)}${t.name !== t.id ? ' — ' + esc(t.id) : ''}${t.rootExists ? '' : ' (폴더 없음)'}</option>`).join('') || '<option value="">(프로젝트 없음)</option>';
}

async function loadProject(id) {
  state.project = id; state.results = {}; state.report = null; state.reportAt = null; state.reportFile = null; state.selected = null; state.server = [];
  try { localStorage.setItem('qa-ui-project', id); } catch (e) {}
  if (!id) { renderAll(); return; }
  await loadSettings();
  await loadIgnores();
  pollServer();
  const latest = await api('/api/latest?project=' + encodeURIComponent(id)).catch(() => null);
  if (latest) {
    for (const r of latest.results) state.results[r.id] = r;
    state.report = { summary: latest.summary, selfcheck: latest.selfcheck, maturity: latest.maturity };
    state.reportFile = latest.file;
    state.reportAt = '지난 검사 ' + latest.file.replace('.json', '').replace(/^(\d{4}-\d{2}-\d{2})-(\d{2})-(\d{2})(?:-\d{2})?$/, '$1 $2:$3') + ' (UTC)';
    state.selected = '__summary';   // 지난 결과가 있으면 요약부터
  }
  renderAll();
}

async function run(ids) {
  const down = state.server.filter(p => !p.up);
  if (down.length && !confirm(`꺼진 서버가 있습니다 (${down.map(p => p.label + ' ' + p.dir).join(', ')}).\nQA 가 설치·빌드·실행까지 해서 켠 뒤 검사합니다 (처음엔 몇 분). 서버 로그의 오류까지 봅니다. 계속할까요?`)) return;
  try { await api('/api/run', json({ project: state.project, ids, level: $('#level').value })); } catch (e) { alert(e.message); return; }
  if (ids.length === 1) state.selected = ids[0];
  state.running = { status: 'running', project: state.project, ids, results: [], current: null };
  for (const id of ids.length ? ids : Object.keys(state.results)) delete state.results[id];
  renderAll();
  poll();
}
async function poll() {
  const j = await api('/api/job').catch(() => null);
  if (!j || j.project !== state.project) return;
  state.running = j;
  for (const r of j.results) state.results[r.id] = r;
  if (j.status === 'done' && j.report && j.report.full) { state.reportFile = j.report.file; const first = state.reportAt !== '방금 전체 검사'; state.report = j.report; state.reportAt = '방금 전체 검사'; if (first) state.selected = '__summary'; }
  renderAll();
  if (j.status === 'running') setTimeout(poll, 700);
}

document.addEventListener('click', e => {
  const ig = e.target.closest('[data-ig]');
  if (ig) {
    e.stopPropagation();
    const f = JSON.parse(ig.dataset.ig);
    const reason = prompt('이 문제를 무시할까요? 이유를 적어 두면 나중에 팀원이 압니다 (예: 오탐 · 의도한 공개 경로 · 다음 달에 고침)', '오탐');
    if (reason === null) return;
    api('/api/ignore', json({ project: state.project, ...f, reason })).then(r => { state.ignores = r.items; ignoreLocal(f.area, f.check, f.item, reason); renderAreas(); renderPanel(); }).catch(err => alert(err.message));
    return;
  }
  const unig = e.target.closest('[data-unig]');
  if (unig) { api('/api/ignore/remove', json({ project: state.project, key: unig.dataset.unig })).then(r => { state.ignores = r.items; renderAreas(); renderPanel(); }).catch(err => alert(err.message)); return; }
  const cf = e.target.closest('[data-copyfix]');
  if (cf) { navigator.clipboard.writeText(fixPrompt(state.report.summary)).then(() => { cf.textContent = '복사했다 — AI 대화창에 붙여 넣기'; setTimeout(() => { cf.textContent = 'AI 에게 고쳐 달라기 — 복사'; }, 2500); }).catch(err => alert('복사 실패: ' + err.message)); return; }
  const runBtn = e.target.closest('[data-run]');
  if (runBtn) { e.stopPropagation(); run([runBtn.dataset.run]); return; }
  const go = e.target.closest('[data-goto]');
  if (go) { e.preventDefault(); state.selected = go.dataset.goto; renderAreas(); renderPanel(); return; }
  const view = e.target.closest('[data-view]');
  if (view) { state.selected = view.dataset.view; renderAreas(); renderPanel(); return; }
  const area = e.target.closest('.area');
  if (area) { state.selected = area.dataset.id; state.filter = 'all'; state.q = ''; renderAreas(); renderPanel(); return; }
  const fb = e.target.closest('[data-filter]');
  if (fb) { state.filter = fb.dataset.filter; renderPanel(); return; }
  const tg = e.target.closest('[data-toggle]');
  if (tg) { state.collapsed[tg.dataset.toggle] = !(state.collapsed[tg.dataset.toggle] ?? false); renderPanel(); return; }
  if (e.target.closest('#score')) { state.selected = '__summary'; renderAreas(); renderPanel(); }
  const sb = e.target.closest('[data-srv]');
  if (sb) serverAction(sb.dataset.srv);
});
$('#openSettings').addEventListener('click', openSettings);
$('#dlgClose').addEventListener('click', () => $('#dlg').close());
$('#btnSave').addEventListener('click', saveSettings);
$('#dlg').addEventListener('click', async e => { if (e.target.id !== 'pwClear') return; e.preventDefault(); state.settings = await api('/api/settings', json({ project: state.project, clear: ['password'] })); fillSettings(); $('#dlgMsg').innerHTML = '<span style="color:var(--ok)">저장된 비밀번호를 지웠습니다 — 이제 .env 값을 씁니다.</span>'; });
$('#btnUpdate').addEventListener('click', updateCode);
$('#btnRebuild').addEventListener('click', async () => { if (await saveSettings()) { $('#dlg').close(); serverAction('start', { rebuild: true }); } });
$('#btnRemove').addEventListener('click', async () => {
  if (!confirm(`${state.project} 을(를) 목록에서 뺄까요? (레포와 리포트는 그대로)`)) return;
  try { await api('/api/projects/remove', json({ project: state.project })); } catch (e) { alert(e.message); return; }
  $('#dlg').close(); await loadProjects(); fillSelect(); await loadProject(state.projects[0] ? state.projects[0].id : null);
});
$('#openAdd').addEventListener('click', () => { $('#aRoot').value = ''; $('#addMsg').textContent = ''; $('#addDlg').showModal(); });
$('#addClose').addEventListener('click', () => $('#addDlg').close());
$('#addCheck').addEventListener('click', () => addProject(true));
$('#addSave').addEventListener('click', () => addProject(false));
$('#toggleLog').addEventListener('click', () => { const pre = $('#srvlog'); pre.hidden = !pre.hidden; $('#toggleLog').textContent = pre.hidden ? '로그 보기' : '로그 숨기기'; renderServer(); });
document.addEventListener('input', e => {
  if (e.target.id === 'q') { state.q = e.target.value; const pos = e.target.selectionStart; renderPanel(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); }
});
try { const lv = localStorage.getItem('qa.level'); if (lv && $(`#level option[value="${lv}"]`)) $('#level').value = lv; } catch { /* 저장소를 못 쓰면 기본값 */ }
$('#level').addEventListener('change', e => { try { localStorage.setItem('qa.level', e.target.value); } catch { /* 무시 */ } });
$('#runAll').addEventListener('click', () => {
  if (confirm(`${$('#level').selectedOptions[0].textContent}: ${$('#level').selectedOptions[0].title}\n\n이 수준에 든 영역을 모두 검사합니다. 대상 서버에 검사용 데이터(계정·글 등)를 만들고 지웁니다. 운영 서버가 아닌지 확인하세요. 계속할까요?`)) run([]);
});
$('#project').addEventListener('change', e => loadProject(e.target.value));

(async () => {
  await loadProjects();
  fillSelect();
  const saved = (() => { try { return localStorage.getItem('qa-ui-project'); } catch (e) { return null; } })();
  const first = state.projects.find(t => t.id === saved) || state.projects.find(t => t.rootExists) || state.projects[0];
  if (!first) { renderAll(); $('#openAdd').click(); return; }
  $('#project').value = first.id;
  await loadProject(first.id);
  poll();   // 이미 돌고 있는 검사가 있으면 이어서 본다
  if (!first.rootExists) openSettings();   // 레포 위치부터
})();
</script>
</body>
</html>
