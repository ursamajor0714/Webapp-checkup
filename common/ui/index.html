<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA 조회</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --line: #e3e6eb; --text: #1b1f24; --muted: #667080; --soft: #eef1f5;
    --ok: #1a7f45; --ok-bg: #e5f5ec; --bad: #c62828; --bad-bg: #fdecea; --warn: #a15c00; --warn-bg: #fff3dc;
    --accent: #2f5bea; --accent-bg: #e8eefe;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --panel: #171b21; --line: #2a3038; --text: #e7eaee; --muted: #9aa4b1; --soft: #1f252d;
      --ok: #4cc38a; --ok-bg: #12301f; --bad: #ff6b6b; --bad-bg: #3a1716; --warn: #f0b24a; --warn-bg: #3a2a10;
      --accent: #7c9cff; --accent-bg: #1c2544;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  button { font: inherit; cursor: pointer; }
  header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 20px; }
  header h1 { font-size: 17px; margin: 0 8px 0 0; }
  select { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); }
  .target { color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 6px 12px; border-radius: 8px; }
  .btn:hover { background: var(--soft); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .score { display: flex; align-items: baseline; gap: 6px; padding: 4px 12px; border-radius: 999px; background: var(--soft); cursor: pointer; }
  .score b { font-size: 18px; }
  .progress { height: 3px; background: var(--accent); width: 0; transition: width .3s; position: sticky; top: 0; }
  .status-line { padding: 8px 20px; background: var(--accent-bg); color: var(--accent); font-weight: 600; display: none; }
  .status-line.error { background: var(--bad-bg); color: var(--bad); }
  main { display: grid; grid-template-columns: 340px 1fr; gap: 16px; padding: 16px 20px; align-items: start; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  aside, .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  aside { padding: 8px; position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow: auto; }
  .sec h3 { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin: 12px 8px 6px; font-weight: 600; letter-spacing: .02em; }
  .area { display: grid; grid-template-columns: 28px 1fr auto auto; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
  .area:hover { background: var(--soft); }
  .area.sel { background: var(--accent-bg); }
  .letter { width: 26px; height: 26px; border-radius: 7px; background: var(--soft); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .area .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .area.todo { opacity: .45; }
  .chip { font-size: 12px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; background: var(--soft); color: var(--muted); }
  .chip.ok { background: var(--ok-bg); color: var(--ok); }
  .chip.bad { background: var(--bad-bg); color: var(--bad); }
  .chip.warn { background: var(--warn-bg); color: var(--warn); }
  .chip.run { background: var(--accent-bg); color: var(--accent); }
  .run-btn { padding: 3px 10px; font-size: 12px; }
  .panel { min-height: 60vh; }
  .ph { padding: 16px 18px 10px; border-bottom: 1px solid var(--line); }
  .ph h2 { margin: 0 0 8px; font-size: 18px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .counts { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .counts .chip { font-size: 13px; padding: 3px 10px; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: var(--panel); color: var(--text); padding: 5px 12px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent); color: #fff; }
  input[type=search] { font: inherit; padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); min-width: 220px; flex: 1; max-width: 360px; }
  .group { border-bottom: 1px solid var(--line); }
  .gh { display: flex; align-items: center; gap: 10px; padding: 10px 18px; background: var(--soft); cursor: pointer; font-weight: 600; position: sticky; top: 56px; }
  .gh .caret { width: 14px; color: var(--muted); }
  .gh .gname { flex: 1; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 7px 12px; border-top: 1px solid var(--line); vertical-align: top; }
  td.mark { width: 44px; text-align: center; font-weight: 800; font-size: 16px; }
  td.mark.ok { color: var(--ok); } td.mark.bad { color: var(--bad); } td.mark.warn { color: var(--warn); }
  tr.bad td { background: color-mix(in srgb, var(--bad-bg) 55%, transparent); }
  td.item { width: 38%; }
  td.detail { color: var(--muted); word-break: break-word; }
  .empty { padding: 60px 20px; text-align: center; color: var(--muted); }
  .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; padding: 16px 18px; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .card .k { color: var(--muted); font-size: 12px; } .card .v { font-size: 22px; font-weight: 700; }
  ul.plain { margin: 0; padding: 0 18px 16px 36px; }
  .srv { display: inline-flex; align-items: center; gap: 8px; padding: 4px 6px 4px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.up { background: var(--ok); } .dot.busy { background: var(--accent); animation: blink 1s infinite; } .dot.err { background: var(--bad); }
  @keyframes blink { 50% { opacity: .3; } }
  .srv .btn { padding: 3px 10px; font-size: 12px; border-radius: 999px; }
  .srvbar { display: none; padding: 10px 20px; background: var(--soft); border-bottom: 1px solid var(--line); }
  .srvbar.on { display: block; }
  .srvbar pre { margin: 8px 0 0; max-height: 220px; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: 12px; white-space: pre-wrap; }
  dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(560px, calc(100vw - 32px)); background: var(--panel); color: var(--text); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  .dlg-h { padding: 16px 20px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 16px; display: flex; justify-content: space-between; }
  .dlg-b { padding: 16px 20px; display: grid; gap: 14px; }
  .dlg-b label { display: grid; gap: 5px; font-weight: 600; font-size: 13px; }
  .dlg-b input { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
  .hint { color: var(--muted); font-weight: 400; font-size: 12px; }
  .dlg-f { padding: 12px 20px 16px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .dlg-f .left { margin-right: auto; }
  .steps { text-align: left; display: inline-block; margin-top: 12px; line-height: 2; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: s .8s linear infinite; vertical-align: -1px; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<header>
  <h1>QA 조회</h1>
  <select id="tool" aria-label="도구"></select>
  <span class="target" id="target"></span>
  <span class="spacer"></span>
  <span class="srv" id="srv"><span class="dot" id="srvDot"></span><span id="srvText">대상 서버 확인 중</span><span id="srvBtns"></span></span>
  <button class="btn" id="openSettings" title="설정">⚙ 설정</button>
  <span class="score" id="score" title="전체 요약 보기"></span>
  <button class="btn primary" id="runAll">전체 검사</button>
</header>
<div class="status-line" id="status"></div>
<div class="srvbar" id="srvbar"><b id="srvbarTitle"></b> <button class="btn run-btn" id="toggleLog">로그 보기</button><pre id="srvlog" hidden></pre></div>
<dialog id="dlg">
  <div class="dlg-h"><span>⚙ 설정 <span class="hint" id="dlgTool"></span></span><button class="btn run-btn" id="dlgClose">닫기</button></div>
  <div class="dlg-b">
    <label>대상 레포 폴더 <span class="hint" id="rootHint"></span><input id="fRoot" placeholder="~/Developer/pyroguard2d"></label>
    <label>대상 주소 <input id="fBase" placeholder="http://localhost:3000"></label>
    <label>로그인 비밀번호 <span class="hint" id="pwHint"></span><input id="fPw" type="password" autocomplete="off"></label>
    <label>119 OTP (6자리) <span class="hint" id="otpHint"></span><input id="fOtp" inputmode="numeric" maxlength="6" autocomplete="off"></label>
    <div class="hint" id="envHint"></div>
    <div id="dlgMsg" class="hint"></div>
  </div>
  <div class="dlg-f">
    <button class="btn left" id="btnUpdate" title="QA 와 대상 레포를 git pull">⬇ 최신 코드 받기</button>
    <button class="btn" id="btnRebuild" title="대상 레포를 다시 빌드하고 켠다">다시 빌드해서 켜기</button>
    <button class="btn primary" id="btnSave">저장</button>
  </div>
</dialog>
<main>
  <aside id="areas"></aside>
  <section class="panel" id="panel"></section>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const state = { tools: [], tool: null, results: {}, report: null, reportAt: null, selected: null, filter: 'all', q: '', running: null, collapsed: {} };

async function api(path, opt) {
  const r = await fetch(path, opt);
  const body = await r.json().catch(() => null);
  if (!r.ok) throw new Error((body && body.error) || r.status);
  return body;
}

// 검사(check) 하나를 O/X 행들로 — items 가 있으면 그대로, 없으면 검사 자체를 한 줄로
function rowsOf(c) {
  if (c.items) return c.items.map(i => ({ name: i.name, detail: i.detail || '', mark: i.ok === true ? 'ok' : i.ok === null ? 'warn' : 'bad' }));
  // 목록이 없는 검사 — 문제 하나당 한 줄, 통과한 것은 묶어서 한 줄
  const rows = [];
  if (c.failed > 0) (c.notes && c.notes.length ? c.notes : [`${c.failed}건 문제`]).forEach(n => rows.push({ name: c.name, detail: n, mark: 'bad' }));
  (c.warnNotes || []).forEach(n => rows.push({ name: c.name, detail: n, mark: 'warn' }));
  if (c.passed > 0 || !rows.length) rows.push({ name: c.name, detail: c.failed > 0 ? `나머지 ${c.passed}건 통과` : (c.notes || []).join(' / ') || `${c.passed}건 통과`, mark: 'ok' });
  return rows;
}
const countOf = r => {
  const rows = (r.checks || []).flatMap(rowsOf);
  return { all: rows.length, ok: rows.filter(x => x.mark === 'ok').length, bad: rows.filter(x => x.mark === 'bad').length, warn: rows.filter(x => x.mark === 'warn').length };
};

function chipFor(p) {
  if (p.todo) return '<span class="chip">빈 칸</span>';
  if (state.running && state.running.current && state.running.current.id === p.id) return '<span class="chip run"><span class="spin"></span> 검사 중</span>';
  if (state.running && state.running.status === 'running' && (!state.running.ids.length || state.running.ids.includes(p.id)) && !state.running.results.some(r => r.id === p.id)) return '<span class="chip run">대기</span>';
  const r = state.results[p.id];
  if (!r) return '<span class="chip">미검사</span>';
  if (r.error) return '<span class="chip bad">실행 오류</span>';
  const n = countOf(r);
  if (n.bad) return `<span class="chip bad">X ${n.bad}</span>`;
  if (n.warn) return `<span class="chip warn">△ ${n.warn}</span>`;
  return `<span class="chip ok">O ${n.ok}</span>`;
}

function renderAreas() {
  const t = state.tools.find(x => x.key === state.tool);
  if (!t) return;
  const busy = state.running && state.running.status === 'running';
  $('#areas').innerHTML = t.sections.map(sec => {
    const sc = state.report && state.report.summary && (state.report.summary.sections || []).find(x => x.dir === sec.dir);
    return `<div class="sec"><h3><span>${esc(sec.label)}</span><span>${sc && sc.score !== null ? esc(sc.score) + '점' : ''}</span></h3>` +
      sec.probes.map(p => `<div class="area ${p.todo ? 'todo' : ''} ${state.selected === p.id ? 'sel' : ''}" data-id="${esc(p.id)}">
        <span class="letter">${esc(p.id)}</span><span class="nm" title="${esc(p.name)}">${esc(p.name)}</span>${chipFor(p)}
        ${p.todo ? '' : `<button class="btn run-btn" data-run="${esc(p.id)}" ${busy ? 'disabled' : ''}>조회</button>`}
      </div>`).join('') + '</div>';
  }).join('');
}

function renderPanel() {
  const panel = $('#panel');
  if (state.selected === '__summary') return renderSummary();
  const t = state.tools.find(x => x.key === state.tool);
  const probe = t && t.sections.flatMap(s => s.probes).find(p => p.id === state.selected);
  const r = state.results[state.selected];
  if (!probe) { panel.innerHTML = guide(); return; }
  const busy = state.running && state.running.status === 'running';
  const head = `<div class="ph"><h2><span class="letter">${esc(probe.id)}</span>${esc(probe.name)}
      <button class="btn run-btn" data-run="${esc(probe.id)}" ${busy ? 'disabled' : ''}>${r ? '다시 조회' : '조회'}</button></h2>`;
  if (!r) { panel.innerHTML = head + `</div><div class="empty">${busy ? '<span class="spin"></span> 검사 중입니다…' : '아직 검사하지 않았습니다. [조회]를 누르세요.'}</div>`; return; }
  if (r.error) { panel.innerHTML = head + `</div><div class="empty" style="color:var(--bad)">실행 오류: ${esc(r.error)}</div>`; return; }
  const n = countOf(r);
  const f = state.filter, q = state.q.trim().toLowerCase();
  const tabs = [['all', `전체 ${n.all}`], ['bad', `문제 ${n.bad}`], ['ok', `통과 ${n.ok}`], ['warn', `확인 필요 ${n.warn}`]];
  let html = head + `<div class="counts">
      <span class="chip">검사 ${n.all}건</span><span class="chip ok">O 통과 ${n.ok}</span>
      <span class="chip bad">X 문제 ${n.bad}</span><span class="chip warn">△ 확인 필요 ${n.warn}</span>
      <span class="chip">${esc(r.ms)}ms</span></div>
    <div class="tools"><div class="seg">${tabs.map(([k, l]) => `<button data-filter="${k}" class="${f === k ? 'on' : ''}">${l}</button>`).join('')}</div>
      <input type="search" id="q" placeholder="항목·내용 검색" value="${esc(state.q)}"></div></div>`;
  let shown = 0;
  r.checks.forEach((c, gi) => {
    const rows = rowsOf(c).filter(x => (f === 'all' || x.mark === f) && (!q || (x.name + ' ' + x.detail).toLowerCase().includes(q)));
    if (!rows.length) return;
    shown += rows.length;
    const key = `${r.id}:${gi}`;
    const cc = { ok: rowsOf(c).filter(x => x.mark === 'ok').length, bad: rowsOf(c).filter(x => x.mark === 'bad').length };
    const closed = state.collapsed[key] ?? false;
    html += `<div class="group"><div class="gh" data-toggle="${key}"><span class="caret">${closed ? '▸' : '▾'}</span>
      <span class="gname">${esc(c.name)}</span>${cc.bad ? `<span class="chip bad">X ${cc.bad}</span>` : ''}<span class="chip ok">O ${cc.ok}</span></div>`;
    if (!closed) {
      html += '<table>' + rows.map(x => `<tr class="${x.mark === 'bad' ? 'bad' : ''}"><td class="mark ${x.mark}">${x.mark === 'ok' ? 'O' : x.mark === 'bad' ? 'X' : '△'}</td>
        <td class="item">${esc(x.name)}</td><td class="detail">${esc(x.detail)}</td></tr>`).join('') + '</table>';
    }
    html += '</div>';
  });
  if (!shown) html += `<div class="empty">${f === 'bad' ? '문제가 없습니다. 👍' : '조건에 맞는 항목이 없습니다.'}</div>`;
  panel.innerHTML = html;
}

function renderSummary() {
  const s = state.report && state.report.summary;
  if (!s) { $('#panel').innerHTML = '<div class="empty">[전체 검사]를 돌리면 점수 요약이 나옵니다.</div>'; return; }
  const self = (state.report.selfcheck && state.report.selfcheck.items) || [];
  const mat = (state.report.maturity && state.report.maturity.items) || [];
  $('#panel').innerHTML = `<div class="ph"><h2>전체 요약 <span class="chip">${esc(state.reportAt || '')}</span></h2></div>
    <div class="summary-grid">
      <div class="card"><div class="k">최종 점수</div><div class="v">${esc(s.score)}</div><div class="k">${esc(s.grade)}</div></div>
      <div class="card"><div class="k">제품 점수</div><div class="v">${esc(s.rawScore)}</div></div>
      <div class="card"><div class="k">검사 / 통과 / 문제</div><div class="v">${esc(s.scanned)} / ${esc(s.passed)} / ${esc(s.failed)}</div></div>
      <div class="card"><div class="k">운영 성숙도</div><div class="v">${esc(s.maturity.got)}/${esc(s.maturity.total)}</div><div class="k">계수 ${esc(s.maturity.factor)}</div></div>
      ${(s.sections || []).map(x => `<div class="card"><div class="k">${esc(x.label)}</div><div class="v">${x.score === null ? '-' : esc(x.score)}</div></div>`).join('')}
    </div>
    <div class="group"><div class="gh">운영 성숙도</div><table>${mat.map(i => `<tr class="${i.ok ? '' : 'bad'}"><td class="mark ${i.ok ? 'ok' : 'bad'}">${i.ok ? 'O' : 'X'}</td><td class="item">${esc(i.label)}</td><td class="detail">${esc(i.weight)}점</td></tr>`).join('')}</table></div>
    <div class="group"><div class="gh">도구 자기 점검</div><table>${self.map(i => `<tr class="${i.ok ? '' : 'bad'}"><td class="mark ${i.ok ? 'ok' : 'bad'}">${i.ok ? 'O' : 'X'}</td><td class="item">${esc(i.label)}</td><td class="detail">${esc((i.notes || []).join(' / '))}</td></tr>`).join('')}</table></div>`;
}

function renderHeader() {
  const t = state.tools.find(x => x.key === state.tool);
  $('#target').innerHTML = t ? `대상 <b>${esc(t.name)}</b> · ${esc(t.baseUrl)}${t.rootExists ? '' : ' · <span style="color:var(--bad)">레포 위치 없음(QA_ROOT)</span>'}` : '';
  const s = state.report && state.report.summary;
  $('#score').innerHTML = s ? `<span>최종</span><b>${esc(s.score)}</b><span>${esc(s.grade)}</span>` : '<span>점수 없음</span>';
  $('#runAll').disabled = !!(state.running && state.running.status === 'running');
}

function renderStatus() {
  const j = state.running, el = $('#status'), bar = $('#progress');
  if (!j) { el.style.display = 'none'; bar.style.width = 0; return; }
  const t = state.tools.find(x => x.key === j.tool);
  const total = j.ids.length || (t ? t.sections.flatMap(s => s.probes).filter(p => !p.todo).length : 1);
  el.className = 'status-line' + (j.status === 'error' ? ' error' : '');
  el.style.display = 'block';
  if (j.status === 'running') {
    el.innerHTML = `<span class="spin"></span> 검사 중 ${j.results.length}/${total}${j.current ? ` · ${esc(j.current.id)} ${esc(j.current.name)}` : ' · 로그인·준비'}`;
    bar.style.width = `${Math.round(j.results.length / total * 100)}%`;
  } else if (j.status === 'error') {
    el.textContent = `실행 오류: ${j.error}`; bar.style.width = 0;
  } else {
    const secs = Math.round((j.finishedAt - j.startedAt) / 1000);
    el.textContent = `끝 · ${j.results.length}개 영역 · ${secs}초` + (j.report && j.report.full ? ` · 리포트 저장 ${j.report.file}` : '');
    bar.style.width = 0;
    setTimeout(() => { if (state.running === j) { state.running = null; renderStatus(); } }, 5000);
  }
}

function renderAll() { renderHeader(); renderAreas(); renderPanel(); renderStatus(); renderServer(); }

// 처음 쓰는 사람을 위한 안내 — 지금 무엇을 누르면 되는지
function guide() {
  const sv = state.server;
  const up = sv && sv.up;
  return `<div class="empty"><div style="font-size:16px;color:var(--text);font-weight:700">${up ? '준비됐습니다' : '시작하기'}</div>
    <ol class="steps">
      <li>${state.settings && state.settings.secrets.every(x => x.set) ? '✅' : '①'} <b>⚙ 설정</b>에서 대상 레포 폴더·로그인 비밀번호·OTP 확인</li>
      <li>${up ? '✅' : '②'} 위쪽 <b>[서버 켜기]</b> — 설치·빌드·실행을 알아서 합니다 (처음엔 1~2분)</li>
      <li>③ <b>[전체 검사]</b> 또는 왼쪽 영역의 <b>[조회]</b> → 결과가 O / X 목록으로</li>
    </ol></div>`;
}

const PHASE = { idle: '꺼짐', installing: '설치 중', building: '빌드 중', starting: '켜는 중', running: '켜짐', stopping: '끄는 중', error: '오류' };
function renderServer() {
  const sv = state.server;
  if (!sv) return;
  const busy = ['installing', 'building', 'starting', 'stopping'].includes(sv.phase);
  $('#srvDot').className = 'dot ' + (sv.up ? 'up' : busy ? 'busy' : sv.phase === 'error' ? 'err' : '');
  $('#srvText').innerHTML = `대상 서버 <b>${esc(sv.up ? '켜짐' : PHASE[sv.phase] || '꺼짐')}</b>`;
  $('#srvBtns').innerHTML = !sv.canServe ? '' : busy ? '<span class="spin"></span>'
    : sv.up ? (sv.managed ? '<button class="btn" data-srv="stop">끄기</button>' : '')
    : '<button class="btn primary" data-srv="start">서버 켜기</button>';
  const bar = $('#srvbar');
  const show = busy || sv.phase === 'error';
  bar.className = 'srvbar' + (show || !$('#srvlog').hidden ? ' on' : '');
  $('#srvbarTitle').innerHTML = sv.phase === 'error' ? `<span style="color:var(--bad)">✗ ${esc(sv.error || '오류')}</span>` : busy ? `<span class="spin"></span> ${esc(PHASE[sv.phase])}…` : '서버 로그';
  $('#srvlog').textContent = (sv.log || []).join('\n');
  if (!$('#srvlog').hidden) $('#srvlog').scrollTop = 1e9;
}

async function pollServer() {
  if (!state.tool) return;
  const sv = await api('/api/server?tool=' + encodeURIComponent(state.tool)).catch(() => null);
  const wasUp = state.server && state.server.up;
  state.server = sv;
  renderServer();
  if (sv && sv.up !== wasUp && !state.selected) renderPanel();
  const busy = sv && ['installing', 'building', 'starting', 'stopping'].includes(sv.phase);
  clearTimeout(state.srvTimer);
  state.srvTimer = setTimeout(pollServer, busy ? 1000 : 4000);
}

async function serverAction(action, extra = {}) {
  try {
    await api('/api/server/' + action, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tool: state.tool, ...extra }) });
  } catch (e) { alert(e.message); }
  if (action === 'start') { $('#srvlog').hidden = false; $('#toggleLog').textContent = '로그 숨기기'; }
  setTimeout(pollServer, 300);
}

async function loadSettings() {
  state.settings = await api('/api/settings?tool=' + encodeURIComponent(state.tool)).catch(() => null);
}
function fillSettings() {
  const st = state.settings;
  if (!st) return;
  $('#dlgTool').textContent = state.tool;
  $('#fRoot').value = st.root || ''; $('#fBase').value = st.baseUrl || '';
  $('#fPw').value = ''; $('#fOtp').value = '';
  $('#rootHint').innerHTML = !st.rootExists ? '<span style="color:var(--bad)">— 폴더가 없습니다</span>' : !st.isRepo ? '<span style="color:var(--bad)">— package.json 이 없습니다</span>' : '— 확인됨';
  const sec = f => st.secrets.find(x => x.field === f) || {};
  const hint = x => x.set ? `— 저장됨 (${esc(x.from)}) · 바꿀 때만 입력` : '— <span style="color:var(--bad)">비어 있음</span>';
  $('#pwHint').innerHTML = hint(sec('operatorPassword'));
  $('#otpHint').innerHTML = hint(sec('otp'));
  $('#envHint').innerHTML = st.envFile ? (st.envFileExists ? `대상 레포의 <b>${esc(st.envFile)}</b> 를 읽습니다. 여기 입력한 값은 이 컴퓨터의 QA 설정에만 저장됩니다.`
    : `대상 레포에 <b>${esc(st.envFile)}</b> 가 없습니다 — [서버 켜기] 때 위 비밀번호·OTP 로 만들어 줍니다.`) : '';
  $('#dlgMsg').textContent = '';
}
async function openSettings() { await loadSettings(); fillSettings(); $('#dlg').showModal(); }

async function saveSettings() {
  try {
    state.settings = await api('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tool: state.tool, root: $('#fRoot').value, baseUrl: $('#fBase').value, operatorPassword: $('#fPw').value, otp: $('#fOtp').value }) });
    fillSettings();
    $('#dlgMsg').innerHTML = '<span style="color:var(--ok)">저장했습니다.</span>';
    state.tools = await api('/api/tools');
    renderHeader(); pollServer(); if (!state.selected) renderPanel();
    return true;
  } catch (e) { $('#dlgMsg').innerHTML = `<span style="color:var(--bad)">${esc(e.message)}</span>`; return false; }
}

async function updateCode() {
  $('#dlgMsg').innerHTML = '<span class="spin"></span> 최신 코드를 받는 중…';
  try {
    const r = await api('/api/update', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tool: state.tool }) });
    const line = (name, x) => `${name}: ${x.ok ? (x.changed ? '✅ 새 코드 받음' : '이미 최신') : '✗ ' + esc(x.out)}`;
    $('#dlgMsg').innerHTML = line('QA', r.qa) + '<br>' + line('대상 레포', r.target) +
      (r.targetChanged ? '<br>대상 코드가 바뀌었습니다 — <b>[다시 빌드해서 켜기]</b>를 누르세요.' : '') +
      (r.restart ? '<br><span class="spin"></span> QA 화면을 새 코드로 다시 띄우는 중…' : (r.qa.changed ? '<br>QA 화면 코드가 바뀌었습니다 — 창을 닫고 다시 실행하세요.' : ''));
    if (r.restart) waitAndReload();
  } catch (e) { $('#dlgMsg').innerHTML = `<span style="color:var(--bad)">${esc(e.message)}</span>`; }
}
async function waitAndReload() {
  await new Promise(r => setTimeout(r, 1500));
  for (let i = 0; i < 60; i++) {
    if (await fetch('/api/ping').then(r => r.ok).catch(() => false)) { location.reload(); return; }
    await new Promise(r => setTimeout(r, 1000));
  }
}

async function loadTool(key) {
  state.tool = key; state.results = {}; state.report = null; state.selected = null;
  try { localStorage.setItem('qa-ui-tool', key); } catch (e) {}
  await loadSettings();
  pollServer();
  const latest = await api('/api/latest?tool=' + encodeURIComponent(key)).catch(() => null);
  if (latest) {
    for (const r of latest.results) state.results[r.id] = r;
    state.report = { summary: latest.summary, selfcheck: latest.selfcheck, maturity: latest.maturity };
    state.reportAt = '지난 검사 ' + latest.file.replace('.json', '').replace(/^(\d{4}-\d{2}-\d{2})-(\d{2})-(\d{2})$/, '$1 $2:$3') + ' (UTC)';
  }
  renderAll();
}

async function run(ids) {
  if (state.server && !state.server.up) { alert('대상 서버가 꺼져 있습니다. 위쪽 [서버 켜기]를 먼저 누르세요.'); return; }
  try {
    await api('/api/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tool: state.tool, ids }) });
  } catch (e) { alert(e.message); return; }
  if (ids.length === 1) state.selected = ids[0];
  // 서버 응답을 기다리지 않고 바로 '검사 중' 으로 — 이전 검사의 '끝' 이 남아 보이지 않게
  state.running = { status: 'running', tool: state.tool, ids, results: [], current: null };
  for (const id of ids.length ? ids : Object.keys(state.results)) delete state.results[id];
  renderAll();
  poll();
}

async function poll() {
  const j = await api('/api/job').catch(() => null);
  if (!j) return;
  if (j.tool !== state.tool) return;
  state.running = j;
  for (const r of j.results) state.results[r.id] = r;
  if (j.status === 'done' && j.report) {
    if (j.report.full) { state.report = j.report; state.reportAt = '방금 전체 검사'; }
  }
  renderAll();
  if (j.status === 'running') setTimeout(poll, 700);
}

document.addEventListener('click', e => {
  const runBtn = e.target.closest('[data-run]');
  if (runBtn) { e.stopPropagation(); run([runBtn.dataset.run]); return; }
  const area = e.target.closest('.area');
  if (area && !area.classList.contains('todo')) { state.selected = area.dataset.id; state.filter = 'all'; state.q = ''; renderAreas(); renderPanel(); return; }
  const fb = e.target.closest('[data-filter]');
  if (fb) { state.filter = fb.dataset.filter; renderPanel(); return; }
  const tg = e.target.closest('[data-toggle]');
  if (tg) { state.collapsed[tg.dataset.toggle] = !(state.collapsed[tg.dataset.toggle] ?? false); renderPanel(); return; }
  if (e.target.closest('#score')) { state.selected = '__summary'; renderAreas(); renderPanel(); }
  const sb = e.target.closest('[data-srv]');
  if (sb) serverAction(sb.dataset.srv);
});
$('#openSettings').addEventListener('click', openSettings);
$('#dlgClose').addEventListener('click', () => $('#dlg').close());
$('#btnSave').addEventListener('click', saveSettings);
$('#btnUpdate').addEventListener('click', updateCode);
$('#btnRebuild').addEventListener('click', async () => { if (await saveSettings()) { $('#dlg').close(); serverAction('start', { rebuild: true }); } });
$('#toggleLog').addEventListener('click', () => { const pre = $('#srvlog'); pre.hidden = !pre.hidden; $('#toggleLog').textContent = pre.hidden ? '로그 보기' : '로그 숨기기'; renderServer(); });
document.addEventListener('input', e => {
  if (e.target.id === 'q') { state.q = e.target.value; const pos = e.target.selectionStart; renderPanel(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); }
});
$('#runAll').addEventListener('click', () => {
  if (state.server && !state.server.up) { alert('대상 서버가 꺼져 있습니다. 위쪽 [서버 켜기]를 먼저 누르세요.'); return; }
  if (confirm('모든 영역을 검사합니다. 대상 서버에 검사용 데이터를 만들고 지웁니다. 계속할까요?')) run([]);
});
$('#tool').addEventListener('change', e => loadTool(e.target.value));

(async () => {
  state.tools = await api('/api/tools');
  const saved = (() => { try { return localStorage.getItem('qa-ui-tool'); } catch (e) { return null; } })();
  const first = state.tools.find(t => t.key === saved) || state.tools.find(t => t.key === 'nextjs') || state.tools[0];
  $('#tool').innerHTML = state.tools.map(t => `<option value="${esc(t.key)}">${esc(t.key)} — ${esc(t.name || '')}</option>`).join('');
  $('#tool').value = first.key;
  await loadTool(first.key);
  poll();   // 이미 돌고 있는 검사가 있으면 이어서 본다
  // 처음 쓰는데 레포 위치나 비밀번호가 없으면 설정 창부터 연다
  const st = state.settings;
  if (st && (!st.isRepo || st.secrets.some(x => !x.set))) openSettings();
})();
</script>
</body>
</html>
